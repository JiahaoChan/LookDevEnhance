[CommonSettings]
SourcePath=%LOCPROJECTROOT%Plugins/LookDevEnhance/Content/Localization/LookDevEnhance
DestinationPath=%LOCPROJECTROOT%Plugins/LookDevEnhance/Content/Localization/LookDevEnhance
ManifestName=LookDevEnhance.manifest
ArchiveName=LookDevEnhance.archive
PortableObjectName=LookDevEnhance.po
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=zh-Hans

;Gather text from source code
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=%LOCPROJECTROOT%Plugins/LookDevEnhance/Source/
FileNameFilters=*.cpp
FileNameFilters=*.h
ShouldGatherFromEditorOnlyData=true

;Gather property display names from reflection metadata
[GatherTextStep1]
CommandletClass=GatherTextFromMetaData
IncludePathFilters=%LOCPROJECTROOT%Plugins/LookDevEnhance/Source/*
FieldTypesToExclude=Function
FieldOuterTypesToExclude=Function
InputKeys=DisplayName
OutputNamespaces=UObjectDisplayNames
OutputKeys="{FieldPath}"
ShouldGatherFromEditorOnlyData=true

;Gather property tooltips from reflection metadata
[GatherTextStep2]
CommandletClass=GatherTextFromMetaData
IncludePathFilters=%LOCPROJECTROOT%Plugins/LookDevEnhance/Source/*
FieldTypesToExclude=Enum
FieldTypesToExclude=Function
FieldOuterTypesToExclude=Function
InputKeys=ToolTip
OutputNamespaces=UObjectToolTips
OutputKeys="{FieldPath}"
ShouldGatherFromEditorOnlyData=true

;Gather categories from reflection metadata
[GatherTextStep3]
CommandletClass=GatherTextFromMetaData
IncludePathFilters=%LOCPROJECTROOT%Plugins/LookDevEnhance/Source/*
FieldTypesToExclude=Enum
FieldTypesToExclude=Function
FieldOuterTypesToExclude=Function
InputKeys=Category
OutputNamespaces=UObjectCategory
OutputKeys="{MetaDataValue}"
ShouldGatherFromEditorOnlyData=true

;Write Manifest
[GatherTextStep4]
CommandletClass=GenerateGatherManifest

;Write Archives
[GatherTextStep5]
CommandletClass=GenerateGatherArchive
bPurgeOldEmptyEntries=true

;Import localized PO files
[GatherTextStep6]
CommandletClass=InternationalizationExport
bImportLoc=true

;Write Localized Text Resource
[GatherTextStep7]
CommandletClass=GenerateTextLocalizationResource
ResourceName=LookDevEnhance.locres

;Export to PO files
[GatherTextStep8]
CommandletClass=InternationalizationExport
bExportLoc=true
